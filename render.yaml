# Blueprint Render per il sito Frameworks
# Uso: dashboard.render.com → New → Blueprint → repository WHYsrl/fwksite → Apply.
# Piani a pagamento: web service Standard (2 GB RAM, 1 CPU, nessuno spegnimento per inattività)
# + disco persistente da 5 GB per database SQLite e upload (sopravvive ai deploy).
# Con il disco il servizio gira su una sola istanza e i deploy hanno qualche secondo di riavvio.
services:
  - type: web
    name: frameworks-site
    runtime: node
    repo: https://github.com/WHYsrl/fwksite
    branch: main
    region: frankfurt
    plan: standard
    numInstances: 1
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: fwks-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false            # richiesta al primo Apply: password del backoffice
      - key: SESSION_SECRET
        generateValue: true    # generata da Render
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false            # richiesta al primo Apply (lasciare vuota se si usa OpenAI)
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
      - key: OPENAI_API_KEY
        sync: false            # richiesta al primo Apply (lasciare vuota se si usa Anthropic)
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: RADAR_SCHEDULE
        value: "on"
